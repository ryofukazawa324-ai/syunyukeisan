<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>月予算メモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:18px 14px 50px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}.monthbar button{border:0;background:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;box-shadow:0 2px 10px #0000000b}.monthbar input{flex:1;border:0;background:transparent;font-size:23px;font-weight:800;text-align:center;color:#172033}.summary,.card,.compare{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.summary strong{font-size:30px}.bar{height:10px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#5379a5}.over{background:#b84c4c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;font-size:17px}.sub{font-size:13px;color:#687386}.amount{font-size:20px;font-weight:800}.quick{display:flex;gap:8px;margin-top:12px}.quick input,.totalInput{width:100%;font-size:18px;padding:11px 12px;border:1px solid #d7dde4;border-radius:12px;background:#fff;color:#172033}.quick button,.reset{border:0;border-radius:12px;padding:0 16px;font-size:16px;font-weight:700;background:#172033;color:white}.history{font-size:12px;color:#7b8490;margin-top:8px;line-height:1.5}.danger{color:#b13d3d}.good{color:#2f7a4f}.reset{width:100%;padding:13px;margin-top:18px;background:#e8ebef;color:#4b5563}.empty{background:#eef3f7;border-radius:14px;padding:13px;margin:10px 0;font-size:13px;color:#5d6875}.budgetBox{margin:4px 0 14px}.budgetBox label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.totalLine{display:flex;gap:8px;align-items:center}.totalInput{font-size:22px;font-weight:800}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compareItem{background:#f6f8fa;border-radius:14px;padding:12px}.compareItem b{display:block;font-size:18px;margin-top:3px}.share{font-size:13px;color:#5379a5;font-weight:700;margin-top:3px}</style></head><body><div class="wrap"><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><input id="monthPicker" type="month" onchange="changeMonth(this.value)"><button onclick="moveMonth(1)">›</button></div><div class="summary"><div class="budgetBox"><label>この月の目標予算</label><div class="totalLine"><input id="totalBudgetInput" class="totalInput" inputmode="numeric" pattern="[0-9]*" onchange="setTotalBudget(this.value)"><span>円</span></div></div><div class="sub">今月の使用額</div><strong id="total">0円</strong><div class="bar"><div id="totalbar" class="fill"></div></div><div id="remain" class="sub"></div></div><div class="compare"><div class="compareGrid"><div class="compareItem"><div class="sub">先月の使用額</div><b id="prevTotal">0円</b></div><div class="compareItem"><div class="sub">先月比</div><b id="prevDiff">—</b><div id="prevDiffSub" class="sub"></div></div></div></div><div id="notice"></div><div id="cards"></div><button class="reset" onclick="resetMonth()">この月のデータを初期化</button></div><script>const DEFAULT_TOTAL=77000;const AUG=[{name:'食費',items:[7025,5053]},{name:'交通費',items:[3000,3000]},{name:'外食',items:[6377]},{name:'外遊費',items:[3800,4160,4000]},{name:'ネットショッピング・ゲーム',items:[5270]},{name:'課金系',items:[1250,4800,1080,6800,3000]}];const EMPTY=AUG.map(x=>({name:x.name,items:[]}));let current='2026-08';let totalBudget=DEFAULT_TOTAL;const old=localStorage.getItem('budget-2026-08-v1');if(old&&!localStorage.getItem('budget-month-2026-08')){try{const legacy=JSON.parse(old).map(x=>({name:x.name,items:x.items||[]}));localStorage.setItem('budget-month-2026-08',JSON.stringify(legacy))}catch(e){}}function key(m){return'budget-month-'+m}function totalKey(m){return'budget-total-'+m}function clone(x){return JSON.parse(JSON.stringify(x))}function normalize(arr){return arr.map((x,i)=>({name:x.name||EMPTY[i]?.name||('項目'+(i+1)),items:Array.isArray(x.items)?x.items:[]}))}function load(m){let s=localStorage.getItem(key(m));if(s){try{return normalize(JSON.parse(s))}catch(e){}}return m==='2026-08'?clone(AUG):clone(EMPTY)}function loadTotal(m){const n=Number(localStorage.getItem(totalKey(m)));return n>0?n:DEFAULT_TOTAL}function prevMonth(m){let[y,mo]=m.split('-').map(Number);mo--;if(mo<1){mo=12;y--}return y+'-'+String(mo).padStart(2,'0')}function monthTotal(m){const d=load(m);return d.reduce((sum,c)=>sum+c.items.reduce((a,b)=>a+Number(b||0),0),0)}let data=load(current);totalBudget=loadTotal(current);const yen=n=>Math.round(n).toLocaleString()+'円';function save(){localStorage.setItem(key(current),JSON.stringify(data));localStorage.setItem(totalKey(current),String(totalBudget))}function hasSaved(m){return localStorage.getItem(key(m))!==null}function render(){document.getElementById('monthPicker').value=current;document.getElementById('totalBudgetInput').value=Math.round(totalBudget);document.getElementById('notice').innerHTML=!hasSaved(current)&&current!=='2026-08'?'<div class="empty">この月はまだ記録がありません。金額を追加すると自動保存されます。</div>':'';const root=document.getElementById('cards');root.innerHTML='';const useds=data.map(c=>c.items.reduce((a,b)=>a+Number(b||0),0));const total=useds.reduce((a,b)=>a+b,0);data.forEach((c,i)=>{const used=useds[i];const share=total?used/total*100:0;const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row"><div><div class="name">${c.name}</div><div class="share">今月支出の ${share.toFixed(1)}%</div></div><div class="amount">${yen(used)}</div></div><div class="bar"><div class="fill" style="width:${Math.min(100,share)}%"></div></div><div class="quick"><input inputmode="numeric" pattern="[0-9]*" placeholder="使った金額" id="in${i}"><button onclick="add(${i})">＋追加</button></div><div class="history">記録: ${c.items.length?c.items.map(x=>yen(x)).join(' + '):'なし'} ${c.items.length?`<button onclick="undo(${i})" style="border:0;background:none;color:#65758b">↩︎ 1件戻す</button>`:''}</div>`;root.appendChild(el)});document.getElementById('total').textContent=yen(total);const remain=totalBudget-total;document.getElementById('remain').textContent=remain>=0?'目標まで残り '+yen(remain)+'（使用 '+(totalBudget?total/totalBudget*100:0).toFixed(1)+'%）':'目標を '+yen(-remain)+' 超過';document.getElementById('remain').className='sub '+(remain<0?'danger':'');const b=document.getElementById('totalbar');b.style.width=Math.min(100,totalBudget?total/totalBudget*100:0)+'%';b.className='fill '+(remain<0?'over':'');const pm=prevMonth(current),pt=monthTotal(pm);document.getElementById('prevTotal').textContent=hasSaved(pm)?yen(pt):'記録なし';const diff=total-pt,pct=pt?diff/pt*100:null;const diffEl=document.getElementById('prevDiff'),sub=document.getElementById('prevDiffSub');if(!hasSaved(pm)){diffEl.textContent='—';diffEl.className='';sub.textContent='先月データがありません'}else if(diff===0){diffEl.textContent='±0円';diffEl.className='';sub.textContent='先月と同額'}else{diffEl.textContent=(diff>0?'+':'−')+yen(Math.abs(diff));diffEl.className=diff>0?'danger':'good';sub.textContent=pct===null?'':(diff>0?'先月より ':'先月より ')+Math.abs(pct).toFixed(1)+'% '+(diff>0?'増':'減')}}function add(i){const input=document.getElementById('in'+i),v=Number(input.value.replace(/,/g,''));if(!v||v<0)return;data[i].items.push(v);save();render()}function undo(i){data[i].items.pop();save();render()}function setTotalBudget(v){const n=Number(String(v).replace(/,/g,''));if(!n||n<=0){render();return}totalBudget=Math.round(n);save();render()}function changeMonth(m){if(!m)return;current=m;data=load(current);totalBudget=loadTotal(current);render()}function moveMonth(d){let[y,m]=current.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}changeMonth(y+'-'+String(m).padStart(2,'0'))}function resetMonth(){if(!confirm(current.replace('-','年')+'月の入力データと目標予算を初期化しますか？'))return;localStorage.removeItem(key(current));localStorage.removeItem(totalKey(current));data=load(current);totalBudget=loadTotal(current);render()}render();</script></body></html>
