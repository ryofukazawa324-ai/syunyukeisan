<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="apple-touch-icon-precomposed" href="apple-touch-icon-precomposed.png"><title>月予算メモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:18px 14px 50px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}.monthbar button{border:0;background:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;box-shadow:0 2px 10px #0000000b}.monthbar input{flex:1;border:0;background:transparent;font-size:23px;font-weight:800;text-align:center;color:#172033}.summary,.card,.compare,.annual,.modeBox,.transferBox{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.summary strong{font-size:30px}.bar{height:10px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#5379a5}.over{background:#b84c4c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;font-size:17px}.sub{font-size:13px;color:#687386}.amount{font-size:20px;font-weight:800}.quick{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}.quick input,.totalInput,.nameEdit,.incomeInput{width:100%;font-size:17px;padding:11px 12px;border:1px solid #d7dde4;border-radius:12px;background:#fff;color:#172033}.quick button,.reset,.editToggle,.copyBtn,.modeBtn,.transferBtn{border:0;border-radius:12px;padding:0 14px;font-size:16px;font-weight:700;background:#172033;color:white}.history{font-size:12px;color:#7b8490;margin-top:8px;line-height:1.6}.historyItem{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #eef1f4}.memo{color:#687386}.danger{color:#b13d3d}.good{color:#2f7a4f}.reset,.editToggle,.copyBtn,.modeBtn{width:100%;padding:13px;margin-top:10px}.reset{background:#e8ebef;color:#4b5563}.editToggle{background:#fff;color:#172033;border:1px solid #d7dde4}.copyBtn{background:#5379a5}.modeBtn{background:#172033}.modeBtn.on{background:#2f7a4f}.transferBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.transferBtn{padding:13px 8px;background:#5379a5}.transferBtn.import{background:#172033}.empty{background:#eef3f7;border-radius:14px;padding:13px;margin:10px 0;font-size:13px;color:#5d6875}.budgetBox{margin:4px 0 14px}.budgetBox label,.incomeBox label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.totalLine{display:flex;gap:8px;align-items:center}.totalInput{font-size:22px;font-weight:800}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compareItem{background:#f6f8fa;border-radius:14px;padding:12px}.compareItem b{display:block;font-size:18px;margin-top:3px}.share{font-size:13px;color:#5379a5;font-weight:700;margin-top:3px}.catCompare{font-size:12px;font-weight:700;margin-top:4px}.editBox{margin-bottom:10px}.editBox label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.editActions{display:flex;gap:8px;margin-top:8px}.editActions button,.addCategoryBtn{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.deleteCat{background:#f6e9e9;color:#a33}.addCategoryBtn{width:100%;margin:0 0 10px;background:#e8eef6;color:#294f7a}.annual h2{font-size:19px;margin:0 0 12px}.annualStats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.annualItem{background:#f6f8fa;border-radius:14px;padding:12px}.annualItem b{display:block;font-size:19px;margin-top:3px}.chart{display:flex;align-items:flex-end;gap:7px;height:190px;padding:14px 4px 24px;margin-top:14px;border-bottom:1px solid #dfe5eb}.monthCol{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;position:relative}.monthBar{width:72%;min-width:12px;background:#5379a5;border-radius:7px 7px 2px 2px;position:relative}.monthLabel{position:absolute;bottom:-22px;font-size:10px;color:#687386}.monthValue{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:#687386;white-space:nowrap;margin-bottom:3px}.incomeBox{margin-top:8px}.incomeInput{font-size:19px;font-weight:700}.annualFoot{font-size:12px;color:#687386;margin-top:10px}.simGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.simGrid label{font-size:12px;color:#687386}.simGrid input{width:100%;margin-top:4px;font-size:17px;padding:10px;border:1px solid #d7dde4;border-radius:12px}.simResult{margin-top:14px;background:#f6f8fa;border-radius:14px;padding:14px}.simResult b{font-size:22px}.simFull{grid-column:1/-1}@media(max-width:480px){.quick{grid-template-columns:1fr 1fr}.quick button{grid-column:1/-1;padding:12px}.annualStats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><input id="monthPicker" type="month" onchange="changeMonth(this.value)"><button onclick="moveMonth(1)">›</button></div><div class="modeBox"><div class="name">住まいモード</div><div id="modeHint" class="sub"></div><button id="modeBtn" class="modeBtn" onclick="toggleSoloMode()"></button></div><div class="summary"><div class="budgetBox"><label>この月の目標予算</label><div class="totalLine"><input id="totalBudgetInput" class="totalInput" inputmode="numeric" onchange="setTotalBudget(this.value)"><span>円</span></div></div><div class="incomeBox"><label>この月の手取り</label><div class="totalLine"><input id="incomeInput" class="incomeInput" inputmode="numeric" placeholder="例 265000" onchange="setIncome(this.value)"><span>円</span></div><div id="incomeHint" class="sub" style="margin-top:5px"></div></div><div class="sub" style="margin-top:14px">今月の使用額</div><strong id="total">0円</strong><div class="bar"><div id="totalbar" class="fill"></div></div><div id="remain" class="sub"></div></div><div class="compare"><div class="compareGrid"><div class="compareItem"><div class="sub">先月の使用額</div><b id="prevTotal">0円</b></div><div class="compareItem"><div class="sub">先月比</div><b id="prevDiff">—</b><div id="prevDiffSub" class="sub"></div></div></div></div><div id="notice"></div><div id="cards"></div><button id="addCategoryBtn" class="addCategoryBtn" onclick="addCategory()" style="display:none">＋ 新しい項目を追加</button><button id="editToggle" class="editToggle" onclick="toggleEdit()">編集モード</button><button class="reset" onclick="resetMonth()">この月のデータを初期化</button><div class="transferBox"><div class="name">📲 データ引き継ぎ</div><div class="sub" style="margin-top:5px">機種変更や別のスマホへ、家計データをまとめて移せます。</div><div class="transferBtns"><button id="exportBtn" class="transferBtn" onclick="exportData()">引き継ぎコードをコピー</button><button class="transferBtn import" onclick="importData()">コードから復元</button></div></div><div class="annual"><h2>🏠 一人暮らしシミュレーション</h2><div class="sub">家賃などを変えると、毎月いくら残るか自動計算します。</div><div class="simGrid"><label>手取り<input id="simIncome" inputmode="numeric" value="265000" oninput="calcSolo()"></label><label>家賃<input id="simRent" inputmode="numeric" value="70000" oninput="calcSolo()"></label><label>食費・外食<input id="simFood" inputmode="numeric" value="35000" oninput="calcSolo()"></label><label>水道光熱費<input id="simUtility" inputmode="numeric" value="12000" oninput="calcSolo()"></label><label>通信費<input id="simComm" inputmode="numeric" value="8000" oninput="calcSolo()"></label><label>交通費<input id="simTransport" inputmode="numeric" value="12000" oninput="calcSolo()"></label><label>課金・娯楽<input id="simFun" inputmode="numeric" value="20000" oninput="calcSolo()"></label><label>日用品等<input id="simDaily" inputmode="numeric" value="10000" oninput="calcSolo()"></label><label>奨学金<input id="simLoan" inputmode="numeric" value="15000" oninput="calcSolo()"></label><label>毎月の投資<input id="simInvest" inputmode="numeric" value="50000" oninput="calcSolo()"></label></div><div class="simResult"><div class="sub">生活費合計</div><b id="simSpend">0円</b><div class="sub" style="margin-top:10px">投資後に自由に残る金額</div><b id="simRemain">0円</b><div id="simRate" class="sub" style="margin-top:5px"></div></div></div><div class="annual"><h2 id="annualTitle">年間サマリー</h2><div class="annualStats"><div class="annualItem"><div class="sub">年間手取り</div><b id="annualIncome">0円</b></div><div class="annualItem"><div class="sub">年間支出</div><b id="annualSpend">0円</b></div><div class="annualItem"><div class="sub">消費率</div><b id="annualRate">—</b></div><div class="annualItem"><div class="sub">残った金額</div><b id="annualRemain">—</b></div></div><div class="sub">月ごとの支出</div><div id="annualChart" class="chart"></div><button id="copyBtn" class="copyBtn" onclick="copyForChatGPT()">📋 チャッピー相談用にコピー</button><div class="annualFoot">年間・月別・項目別のデータをまとめてコピーして、そのままChatGPTに貼り付けられます。</div></div></div><script>const APP_VERSION='2026-09-24-01',DEFAULT_TOTAL=77000,BASE_NAMES=['食費','交通費','外食','外遊費','ネットショッピング・ゲーム','課金系','家賃'],SOLO_NAMES=['通信費','水道光熱費','日用品'],RECURRING_NAMES=['家賃','通信費','水道光熱費'],LAST_MONTH_KEY='budget-last-opened-month',SOLO_KEY='budget-solo-mode';let current=/^\d{4}-\d{2}$/.test(localStorage.getItem(LAST_MONTH_KEY)||'')?localStorage.getItem(LAST_MONTH_KEY):'2026-08',soloMode=localStorage.getItem(SOLO_KEY)==='1',totalBudget=DEFAULT_TOTAL,income=0,incomeInherited=false,editMode=false;function key(m){return'budget-month-'+m}function totalKey(m){return'budget-total-'+m}function incomeKey(m){return'budget-income-'+m}function prevMonth(m){let[y,mo]=m.split('-').map(Number);if(--mo<1){mo=12;y--}return y+'-'+String(mo).padStart(2,'0')}function normalize(arr){return(Array.isArray(arr)?arr:[]).map((x,i)=>({name:x.name||BASE_NAMES[i]||('項目'+(i+1)),items:Array.isArray(x.items)?x.items.map(v=>typeof v==='object'?{amount:Number(v.amount)||0,memo:String(v.memo||'')}:{amount:Number(v)||0,memo:''}):[]}))}function ensureCategories(arr){const out=normalize(arr);[...BASE_NAMES,...SOLO_NAMES].forEach(n=>{if(!out.some(x=>x.name===n))out.push({name:n,items:[]})});return out}function findPreviousCategoryAmount(m,name){let p=prevMonth(m);for(let i=0;i<120;i++){const s=localStorage.getItem(key(p));if(s)try{const c=ensureCategories(JSON.parse(s)).find(x=>x.name===name),v=c?c.items.reduce((a,b)=>a+Number(b.amount||0),0):0;if(v>0)return v}catch(e){}p=prevMonth(p)}return 0}function load(m){const s=localStorage.getItem(key(m));if(s)try{return ensureCategories(JSON.parse(s))}catch(e){}const out=ensureCategories([]);if(m>'2026-08')RECURRING_NAMES.forEach(name=>{const v=findPreviousCategoryAmount(m,name);if(v>0)out.find(x=>x.name===name).items=[{amount:v,memo:'先月から据え置き'}]});return out}function previousTotalBudget(m){let p=prevMonth(m);for(let i=0;i<120;i++){const n=Number(localStorage.getItem(totalKey(p)));if(n>0)return n;p=prevMonth(p)}return DEFAULT_TOTAL}function loadTotal(m){return Number(localStorage.getItem(totalKey(m)))||previousTotalBudget(m)}function previousIncome(m){let p=prevMonth(m);for(let i=0;i<120;i++){const n=Number(localStorage.getItem(incomeKey(p)));if(n>0)return n;p=prevMonth(p)}return 0}function getIncomeInfo(m){const n=Number(localStorage.getItem(incomeKey(m)));if(n>0)return{value:n,inherited:false};const v=previousIncome(m);return{value:v,inherited:v>0}}function hasSaved(m){return localStorage.getItem(key(m))!==null}function monthTotal(m){if(m!==current&&!hasSaved(m))return 0;return(m===current?data:load(m)).reduce((s,c)=>s+c.items.reduce((a,b)=>a+Number(b.amount||0),0),0)}let data=load(current);totalBudget=loadTotal(current);({value:income,inherited:incomeInherited}=getIncomeInfo(current));const yen=n=>Math.round(n).toLocaleString()+'円';function save(){localStorage.setItem(key(current),JSON.stringify(data));localStorage.setItem(totalKey(current),String(totalBudget));if(!incomeInherited&&income>0)localStorage.setItem(incomeKey(current),String(income));else if(!incomeInherited)localStorage.removeItem(incomeKey(current))}function render(){monthPicker.value=current;totalBudgetInput.value=Math.round(totalBudget);incomeInput.value=income?Math.round(income):'';incomeHint.textContent=incomeInherited?'前回入力した手取りを引き継いでいます':'';modeBtn.textContent=soloMode?'🏠 一人暮らしモード ON':'🏠 一人暮らしモードにする';modeBtn.className='modeBtn '+(soloMode?'on':'');modeHint.textContent=soloMode?'通信費・水道光熱費・日用品を表示中':'通常モード';editToggle.textContent=editMode?'編集モードを終了':'編集モード';addCategoryBtn.style.display=editMode?'block':'none';notice.innerHTML=!hasSaved(current)&&current!=='2026-08'?'<div class="empty">未入力月です。直近の固定費を初期表示しています。</div>':'';cards.innerHTML='';cards.style.display='flex';cards.style.flexDirection='column';const useds=data.map(c=>c.items.reduce((a,b)=>a+Number(b.amount||0),0)),tot=useds.reduce((a,b)=>a+b,0),pd=hasSaved(prevMonth(current))?load(prevMonth(current)):null;data.forEach((c,i)=>{if(SOLO_NAMES.includes(c.name)&&!soloMode)return;const used=useds[i],share=tot?used/tot*100:0;let ct='先月比：比較なし',cc='sub';if(pd){const pc=pd.find(x=>x.name===c.name);if(pc){const pu=pc.items.reduce((s,x)=>s+Number(x.amount||0),0),df=used-pu;if(pu>0){const pp=df/pu*100,s=df>0?'+':df<0?'−':'±';ct='先月比 '+s+yen(Math.abs(df))+'（'+s+Math.abs(pp).toFixed(1)+'%）';cc='catCompare '+(df>0?'danger':df<0?'good':'')}else if(!used){ct='先月比 ±0円（0.0%）';cc='catCompare'}else{ct='先月比 +'+yen(used)+'（比較なし）';cc='catCompare danger'}}}const el=document.createElement('div');el.className='card';el.style.order=-used;const h=c.items.length?c.items.map((x,j)=>`<div class="historyItem"><span>${yen(x.amount)}${x.memo?` <span class="memo">（${escapeHtml(x.memo)}）</span>`:''}</span><button onclick="removeItem(${i},${j})" style="border:0;background:none;color:#65758b">削除</button></div>`).join(''):'記録なし';el.innerHTML=`${editMode?`<div class="editBox"><label>項目名</label><input class="nameEdit" value="${escapeAttr(c.name)}" onchange="renameCategory(${i},this.value)"><div class="editActions"><button class="deleteCat" onclick="deleteCategory(${i})">この項目を削除</button></div></div>`:''}<div class="row"><div><div class="name">${escapeHtml(c.name)}</div><div class="share">今月支出の ${share.toFixed(1)}%</div><div class="${cc}">${ct}</div></div><div class="amount">${yen(used)}</div></div><div class="bar"><div class="fill" style="width:${Math.min(100,share)}%"></div></div><div class="quick"><input inputmode="numeric" placeholder="使った金額" id="in${i}"><input placeholder="メモ" id="memo${i}"><button onclick="add(${i})">＋追加</button></div><div class="history">${h}</div>`;cards.appendChild(el)});total.textContent=yen(tot);const r=totalBudget-tot;remain.textContent=r>=0?'目標まで残り '+yen(r)+'（使用 '+(totalBudget?tot/totalBudget*100:0).toFixed(1)+'%）':'目標を '+yen(-r)+' 超過';remain.className='sub '+(r<0?'danger':'');totalbar.style.width=Math.min(100,totalBudget?tot/totalBudget*100:0)+'%';totalbar.className='fill '+(r<0?'over':'');const pm=prevMonth(current),pt=monthTotal(pm),df=tot-pt;prevTotal.textContent=hasSaved(pm)?yen(pt):'記録なし';if(!hasSaved(pm)){prevDiff.textContent='—';prevDiffSub.textContent='先月データがありません'}else{prevDiff.textContent=(df>0?'+':df<0?'−':'±')+yen(Math.abs(df));prevDiff.className=df>0?'danger':df<0?'good':'';prevDiffSub.textContent=pt?'先月より '+Math.abs(df/pt*100).toFixed(1)+'% '+(df>0?'増':df<0?'減':'同額'):'比較なし'}renderAnnual()}function calcSolo(){const ids=['simRent','simFood','simUtility','simComm','simTransport','simFun','simDaily','simLoan'];const val=id=>Math.max(0,Number((document.getElementById(id)?.value||'0').replace(/,/g,''))||0);const inc=val('simIncome'),sp=ids.reduce((s,id)=>s+val(id),0),inv=val('simInvest'),rem=inc-sp-inv;simSpend.textContent=yen(sp);simRemain.textContent=(rem<0?'−':'')+yen(Math.abs(rem));simRemain.className=rem<0?'danger':'good';simRate.textContent='生活費率 '+(inc?sp/inc*100:0).toFixed(1)+'% ／ 投資 '+yen(inv)+' ／ 生活費＋投資後 '+(rem>=0?'余裕あり':'赤字')}function annualData(){const year=current.slice(0,4),monthly=[];let spend=0,inc=0;for(let m=1;m<=12;m++){const ym=year+'-'+String(m).padStart(2,'0'),active=hasSaved(ym)||Number(localStorage.getItem(incomeKey(ym)))>0,s=hasSaved(ym)?monthTotal(ym):0,i=active?getIncomeInfo(ym).value:0;monthly.push({m,s,i,active});spend+=s;inc+=i}return{year,monthly,spend,inc}}function renderAnnual(){const a=annualData();annualTitle.textContent=a.year+'年 年間サマリー';annualIncome.textContent=a.inc?yen(a.inc):'未入力';annualSpend.textContent=yen(a.spend);annualRate.textContent=a.inc?(a.spend/a.inc*100).toFixed(1)+'%':'—';const r=a.inc?a.inc-a.spend:null;annualRemain.textContent=r===null?'—':(r>=0?yen(r):'−'+yen(-r));const mx=Math.max(...a.monthly.map(x=>x.s),1);annualChart.innerHTML=a.monthly.map(x=>`<div class="monthCol"><div class="monthBar" style="height:${Math.max(2,x.s/mx*100)}%">${x.s?`<div class="monthValue">${Math.round(x.s/1000)}k</div>`:''}</div><div class="monthLabel">${x.m}月</div></div>`).join('')}function buildChatText(){const a=annualData();let t=`家計データを見て、支出の傾向・使いすぎている項目・改善できそうな点を分析してほしい。\n\n【${a.year}年 年間サマリー】\n年間手取り：${a.inc?yen(a.inc):'未入力'}\n年間支出：${yen(a.spend)}\n消費率：${a.inc?(a.spend/a.inc*100).toFixed(1)+'%':'未計算'}\n残った金額：${a.inc?yen(a.inc-a.spend):'未計算'}\n\n【月別】\n`;a.monthly.forEach(x=>{if(x.active||x.s)t+=`${x.m}月：支出 ${yen(x.s)}／手取り ${x.i?yen(x.i):'未入力'}\n`});t+='\n【月別の項目・明細】\n';for(let m=1;m<=12;m++){const ym=a.year+'-'+String(m).padStart(2,'0');if(!hasSaved(ym))continue;const d=load(ym),mt=monthTotal(ym);t+=`\n■ ${m}月（合計 ${yen(mt)}）\n`;d.map(c=>({c,v:c.items.reduce((s,x)=>s+Number(x.amount||0),0)})).filter(x=>x.v).sort((a,b)=>b.v-a.v).forEach(({c,v})=>{t+=`・${c.name}: ${yen(v)}（${mt?(v/mt*100).toFixed(1):0}%）\n`;c.items.forEach(x=>t+=`  - ${yen(x.amount)}${x.memo?'（'+x.memo+'）':''}\n`)})}return t}async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}async function copyForChatGPT(){const ok=await copyText(buildChatText());copyBtn.textContent=ok?'✓ コピーしました':'コピーできませんでした';setTimeout(()=>copyBtn.textContent='📋 チャッピー相談用にコピー',1800)}function makeTransferCode(){const d={version:1,created:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('budget-'))d.data[k]=localStorage.getItem(k)}return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}async function exportData(){const ok=await copyText(makeTransferCode());exportBtn.textContent=ok?'✓ コピーしました':'コピーできませんでした';setTimeout(()=>exportBtn.textContent='引き継ぎコードをコピー',1800)}function importData(){const code=prompt('前の端末でコピーした「引き継ぎコード」を貼り付けてください。');if(!code)return;try{const d=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!d||d.version!==1||!d.data)throw 0;if(!confirm('この端末の家計データを、引き継ぎコードの内容で復元します。よろしいですか？'))return;Object.keys(d.data).forEach(k=>{if(k.startsWith('budget-'))localStorage.setItem(k,String(d.data[k]))});alert('データを引き継ぎました。');location.reload()}catch(e){alert('引き継ぎコードを読み込めませんでした。コードを最初から最後までコピーしてください。')}}function add(i){const v=Number((document.getElementById('in'+i).value||'').replace(/,/g,''));if(!v||v<0)return;data[i].items.push({amount:v,memo:document.getElementById('memo'+i).value.trim()});save();render()}function removeItem(i,j){data[i].items.splice(j,1);save();render()}function renameCategory(i,v){if(v.trim()){data[i].name=v.trim();save()}render()}function addCategory(){const n=prompt('追加する項目名を入力してください。');if(!n||!n.trim())return;data.push({name:n.trim(),items:[]});save();render()}function deleteCategory(i){const c=data[i];if(!c)return;const used=c.items.reduce((s,x)=>s+Number(x.amount||0),0);if(!confirm('「'+c.name+'」を削除します。'+(used?'\nこの項目の記録 '+yen(used)+' も削除されます。':'')+'\nよろしいですか？'))return;data.splice(i,1);save();render()}function toggleEdit(){editMode=!editMode;render()}function toggleSoloMode(){soloMode=!soloMode;localStorage.setItem(SOLO_KEY,soloMode?'1':'0');render()}function setTotalBudget(v){const n=Number(String(v).replace(/,/g,''));if(n>0){totalBudget=Math.round(n);save()}render()}function setIncome(v){income=Math.max(0,Math.round(Number(String(v).replace(/,/g,''))||0));incomeInherited=false;save();render()}function changeMonth(m){if(!m)return;current=m;localStorage.setItem(LAST_MONTH_KEY,current);data=load(current);totalBudget=loadTotal(current);({value:income,inherited:incomeInherited}=getIncomeInfo(current));editMode=false;render()}function moveMonth(d){let[y,m]=current.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}changeMonth(y+'-'+String(m).padStart(2,'0'))}function resetMonth(){if(!confirm(current+' のデータを初期化しますか？'))return;localStorage.removeItem(key(current));localStorage.removeItem(totalKey(current));localStorage.removeItem(incomeKey(current));data=load(current);totalBudget=loadTotal(current);({value:income,inherited:incomeInherited}=getIncomeInfo(current));render()}function escapeHtml(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]||c))}function escapeAttr(s){return escapeHtml(s)}localStorage.setItem(LAST_MONTH_KEY,current);let lastUpdateCheck=0;async function checkForUpdate(){const now=Date.now();if(now-lastUpdateCheck<15000)return;lastUpdateCheck=now;try{const html=await fetch(location.pathname+'?updatecheck='+now,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const APP_VERSION='([^']+)'/);if(m&&m[1]!==APP_VERSION)location.replace(location.pathname+'?v='+m[1])}catch(e){}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});window.addEventListener('focus',checkForUpdate);setTimeout(checkForUpdate,1500);render();calcSolo();</script></body></html>
