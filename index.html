<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>月予算メモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:18px 14px 50px}h1{font-size:24px;margin:4px 0 14px}.summary,.card{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.summary strong{font-size:30px}.bar{height:10px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#5379a5}.over{background:#b84c4c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;font-size:17px}.sub{font-size:13px;color:#687386}.amount{font-size:20px;font-weight:800}.quick{display:flex;gap:8px;margin-top:12px}.quick input{width:100%;font-size:18px;padding:12px;border:1px solid #d7dde4;border-radius:12px}.quick button,.reset{border:0;border-radius:12px;padding:0 16px;font-size:16px;font-weight:700;background:#172033;color:white}.history{font-size:12px;color:#7b8490;margin-top:8px;line-height:1.5}.danger{color:#b13d3d}.reset{width:100%;padding:13px;margin-top:18px;background:#e8ebef;color:#4b5563}</style></head><body><div class="wrap"><h1>8月 家計メモ</h1><div class="summary"><div class="sub">目標予算 77,000円以下</div><strong id="total">0円</strong><div class="bar"><div id="totalbar" class="fill"></div></div><div id="remain" class="sub"></div></div><div id="cards"></div><button class="reset" onclick="if(confirm('8月の入力データを初期値に戻しますか？')){localStorage.removeItem(KEY);location.reload()}">8月データを初期値に戻す</button></div><script>const KEY='budget-2026-08-v1';const initial=[{name:'食費',budget:16000,items:[7025,5053]},{name:'交通費',budget:13150,items:[3000,3000]},{name:'外食',budget:18094,items:[6377]},{name:'外遊費',budget:4446,items:[3800,4160,4000]},{name:'ネットショッピング・ゲーム',budget:12500,items:[5270]},{name:'課金系',budget:11500,items:[1250,4800,1080,6800,3000]}];let data=JSON.parse(localStorage.getItem(KEY)||'null')||initial;const yen=n=>n.toLocaleString()+'円';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function render(){const root=document.getElementById('cards');root.innerHTML='';let total=0;data.forEach((c,i)=>{const used=c.items.reduce((a,b)=>a+b,0);total+=used;const rem=c.budget-used;const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row"><div><div class="name">${c.name}</div><div class="sub">予算 ${yen(c.budget)}</div></div><div class="amount ${rem<0?'danger':''}">${yen(used)}</div></div><div class="bar"><div class="fill ${rem<0?'over':''}" style="width:${Math.min(100,used/c.budget*100)}%"></div></div><div class="sub ${rem<0?'danger':''}">${rem>=0?'残り '+yen(rem):'超過 '+yen(-rem)}</div><div class="quick"><input inputmode="numeric" pattern="[0-9]*" placeholder="使った金額" id="in${i}"><button onclick="add(${i})">＋追加</button></div><div class="history">記録: ${c.items.length?c.items.map(x=>yen(x)).join(' + '):'なし'} ${c.items.length?`<button onclick="undo(${i})" style="border:0;background:none;color:#65758b">↩︎ 1件戻す</button>`:''}</div>`;root.appendChild(el)});document.getElementById('total').textContent=yen(total);const remain=77000-total;document.getElementById('remain').textContent=remain>=0?'全体残り '+yen(remain):'予算超過 '+yen(-remain);document.getElementById('remain').className='sub '+(remain<0?'danger':'');const b=document.getElementById('totalbar');b.style.width=Math.min(100,total/77000*100)+'%';b.className='fill '+(remain<0?'over':'')}function add(i){const input=document.getElementById('in'+i),v=Number(input.value.replace(/,/g,''));if(!v||v<0)return;data[i].items.push(v);save();render()}function undo(i){data[i].items.pop();save();render()}render();</script></body></html>
