<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>月予算メモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:18px 14px 50px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}.monthbar button{border:0;background:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;box-shadow:0 2px 10px #0000000b}.monthbar input{flex:1;border:0;background:transparent;font-size:23px;font-weight:800;text-align:center;color:#172033}.summary,.card{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.summary strong{font-size:30px}.bar{height:10px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#5379a5}.over{background:#b84c4c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;font-size:17px}.sub{font-size:13px;color:#687386}.amount{font-size:20px;font-weight:800}.quick{display:flex;gap:8px;margin-top:12px}.quick input,.budgetInput,.ratioInput,.totalInput{width:100%;font-size:18px;padding:11px 12px;border:1px solid #d7dde4;border-radius:12px;background:#fff;color:#172033}.quick button,.reset,.fitbtn{border:0;border-radius:12px;padding:0 16px;font-size:16px;font-weight:700;background:#172033;color:white}.history{font-size:12px;color:#7b8490;margin-top:8px;line-height:1.5}.danger{color:#b13d3d}.reset{width:100%;padding:13px;margin-top:18px;background:#e8ebef;color:#4b5563}.empty{background:#eef3f7;border-radius:14px;padding:13px;margin:10px 0;font-size:13px;color:#5d6875}.budgetBox{margin:12px 0 4px}.budgetBox label,.editBudget label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.totalLine{display:flex;gap:8px;align-items:center}.totalInput{font-size:22px;font-weight:800}.fitbtn{padding:12px 14px;margin-top:8px;width:100%;background:#5379a5}.editBudget{display:grid;grid-template-columns:1fr 105px;gap:8px;margin-top:12px}.ratioWrap{position:relative}.ratioWrap:after{content:'%';position:absolute;right:12px;top:34px;color:#687386}.ratioInput{padding-right:30px}.alloc{font-size:12px;margin-top:8px;color:#687386}.alloc.danger{color:#b13d3d}</style></head><body><div class="wrap"><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><input id="monthPicker" type="month" onchange="changeMonth(this.value)"><button onclick="moveMonth(1)">›</button></div><div class="summary"><div class="budgetBox"><label>この月の目標予算</label><div class="totalLine"><input id="totalBudgetInput" class="totalInput" inputmode="numeric" pattern="[0-9]*" onchange="setTotalBudget(this.value)"><span>円</span></div><button class="fitbtn" onclick="fitBudgetsToTotal()">現在の比率のまま全体予算に合わせる</button><div id="allocation" class="alloc"></div></div><div class="sub" style="margin-top:14px">現在の支出</div><strong id="total">0円</strong><div class="bar"><div id="totalbar" class="fill"></div></div><div id="remain" class="sub"></div></div><div id="notice"></div><div id="cards"></div><button class="reset" onclick="resetMonth()">この月のデータを初期化</button></div><script>const DEFAULT_TOTAL=77000;const AUG=[{name:'食費',budget:16000,items:[7025,5053]},{name:'交通費',budget:13150,items:[3000,3000]},{name:'外食',budget:18094,items:[6377]},{name:'外遊費',budget:4446,items:[3800,4160,4000]},{name:'ネットショッピング・ゲーム',budget:12500,items:[5270]},{name:'課金系',budget:11500,items:[1250,4800,1080,6800,3000]}];const EMPTY=AUG.map(x=>({name:x.name,budget:x.budget,items:[]}));let current='2026-08';let totalBudget=DEFAULT_TOTAL;const old=localStorage.getItem('budget-2026-08-v1');if(old&&!localStorage.getItem('budget-month-2026-08'))localStorage.setItem('budget-month-2026-08',old);function key(m){return'budget-month-'+m}function totalKey(m){return'budget-total-'+m}function clone(x){return JSON.parse(JSON.stringify(x))}function load(m){let s=localStorage.getItem(key(m));if(s)return JSON.parse(s);return m==='2026-08'?clone(AUG):clone(EMPTY)}function loadTotal(m){const n=Number(localStorage.getItem(totalKey(m)));return n>0?n:DEFAULT_TOTAL}let data=load(current);totalBudget=loadTotal(current);const yen=n=>Math.round(n).toLocaleString()+'円';function save(){localStorage.setItem(key(current),JSON.stringify(data));localStorage.setItem(totalKey(current),String(totalBudget))}function hasSaved(m){return localStorage.getItem(key(m))!==null}function render(){document.getElementById('monthPicker').value=current;document.getElementById('totalBudgetInput').value=Math.round(totalBudget);document.getElementById('notice').innerHTML=!hasSaved(current)&&current!=='2026-08'?'<div class="empty">この月はまだ記録がありません。金額や予算を変更すると自動保存されます。</div>':'';const root=document.getElementById('cards');root.innerHTML='';let total=0,budgetSum=0;data.forEach((c,i)=>{const used=c.items.reduce((a,b)=>a+b,0);total+=used;budgetSum+=Number(c.budget)||0;const rem=c.budget-used;const ratio=totalBudget?c.budget/totalBudget*100:0;const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row"><div><div class="name">${c.name}</div><div class="sub">予算 ${yen(c.budget)}・${ratio.toFixed(1)}%</div></div><div class="amount ${rem<0?'danger':''}">${yen(used)}</div></div><div class="bar"><div class="fill ${rem<0?'over':''}" style="width:${Math.min(100,c.budget?used/c.budget*100:0)}%"></div></div><div class="sub ${rem<0?'danger':''}">${rem>=0?'残り '+yen(rem):'超過 '+yen(-rem)}</div><div class="editBudget"><div><label>項目予算（円）</label><input class="budgetInput" inputmode="numeric" pattern="[0-9]*" value="${Math.round(c.budget)}" onchange="setCategoryBudget(${i},this.value)"></div><div class="ratioWrap"><label>全体に対する比率</label><input class="ratioInput" inputmode="decimal" value="${ratio.toFixed(1)}" onchange="setCategoryRatio(${i},this.value)"></div></div><div class="quick"><input inputmode="numeric" pattern="[0-9]*" placeholder="使った金額" id="in${i}"><button onclick="add(${i})">＋追加</button></div><div class="history">記録: ${c.items.length?c.items.map(x=>yen(x)).join(' + '):'なし'} ${c.items.length?`<button onclick="undo(${i})" style="border:0;background:none;color:#65758b">↩︎ 1件戻す</button>`:''}</div>`;root.appendChild(el)});document.getElementById('total').textContent=yen(total);const remain=totalBudget-total;document.getElementById('remain').textContent=remain>=0?'全体残り '+yen(remain):'予算超過 '+yen(-remain);document.getElementById('remain').className='sub '+(remain<0?'danger':'');const b=document.getElementById('totalbar');b.style.width=Math.min(100,totalBudget?total/totalBudget*100:0)+'%';b.className='fill '+(remain<0?'over':'');const pct=totalBudget?budgetSum/totalBudget*100:0;const a=document.getElementById('allocation');a.textContent='項目予算の合計 '+yen(budgetSum)+'（'+pct.toFixed(1)+'%）'+(budgetSum<totalBudget?'／未配分 '+yen(totalBudget-budgetSum):budgetSum>totalBudget?'／超過配分 '+yen(budgetSum-totalBudget):'／ぴったり配分');a.className='alloc '+(budgetSum>totalBudget?'danger':'')}function add(i){const input=document.getElementById('in'+i),v=Number(input.value.replace(/,/g,''));if(!v||v<0)return;data[i].items.push(v);save();render()}function undo(i){data[i].items.pop();save();render()}function setTotalBudget(v){const n=Number(String(v).replace(/,/g,''));if(!n||n<=0){render();return}totalBudget=Math.round(n);save();render()}function setCategoryBudget(i,v){const n=Number(String(v).replace(/,/g,''));if(isNaN(n)||n<0){render();return}data[i].budget=Math.round(n);save();render()}function setCategoryRatio(i,v){const n=Number(String(v).replace('%',''));if(isNaN(n)||n<0){render();return}data[i].budget=Math.round(totalBudget*n/100);save();render()}function fitBudgetsToTotal(){const sum=data.reduce((s,c)=>s+(Number(c.budget)||0),0);if(sum<=0)return;let assigned=0;data.forEach((c,i)=>{if(i===data.length-1){c.budget=totalBudget-assigned}else{c.budget=Math.round(totalBudget*c.budget/sum);assigned+=c.budget}});save();render()}function changeMonth(m){if(!m)return;current=m;data=load(current);totalBudget=loadTotal(current);render()}function moveMonth(d){let[y,m]=current.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}changeMonth(y+'-'+String(m).padStart(2,'0'))}function resetMonth(){if(!confirm(current.replace('-','年')+'月の入力データと予算設定を初期化しますか？'))return;localStorage.removeItem(key(current));localStorage.removeItem(totalKey(current));data=load(current);totalBudget=loadTotal(current);render()}render();</script></body></html>
