<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>月予算メモ</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:18px 14px 50px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}.monthbar button{border:0;background:#fff;border-radius:12px;width:44px;height:44px;font-size:22px;box-shadow:0 2px 10px #0000000b}.monthbar input{flex:1;border:0;background:transparent;font-size:23px;font-weight:800;text-align:center;color:#172033}.summary,.card,.compare,.annual,.modeBox{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #0000000b}.summary strong{font-size:30px}.bar{height:10px;background:#e7ebef;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#5379a5}.over{background:#b84c4c}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;font-size:17px}.sub{font-size:13px;color:#687386}.amount{font-size:20px;font-weight:800}.quick{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}.quick input,.totalInput,.nameEdit,.incomeInput{width:100%;font-size:17px;padding:11px 12px;border:1px solid #d7dde4;border-radius:12px;background:#fff;color:#172033}.quick button,.reset,.editToggle,.copyBtn,.modeBtn{border:0;border-radius:12px;padding:0 14px;font-size:16px;font-weight:700;background:#172033;color:white}.history{font-size:12px;color:#7b8490;margin-top:8px;line-height:1.6}.historyItem{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #eef1f4}.memo{color:#687386}.danger{color:#b13d3d}.good{color:#2f7a4f}.reset,.editToggle,.copyBtn,.modeBtn{width:100%;padding:13px;margin-top:10px}.reset{background:#e8ebef;color:#4b5563}.editToggle{background:#fff;color:#172033;border:1px solid #d7dde4}.copyBtn{background:#5379a5}.modeBtn{background:#172033}.modeBtn.on{background:#2f7a4f}.empty{background:#eef3f7;border-radius:14px;padding:13px;margin:10px 0;font-size:13px;color:#5d6875}.budgetBox{margin:4px 0 14px}.budgetBox label,.incomeBox label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.totalLine{display:flex;gap:8px;align-items:center}.totalInput{font-size:22px;font-weight:800}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compareItem{background:#f6f8fa;border-radius:14px;padding:12px}.compareItem b{display:block;font-size:18px;margin-top:3px}.share{font-size:13px;color:#5379a5;font-weight:700;margin-top:3px}.catCompare{font-size:12px;font-weight:700;margin-top:4px}.editBox{margin-bottom:10px}.editBox label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.annual h2{font-size:19px;margin:0 0 12px}.annualStats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.annualItem{background:#f6f8fa;border-radius:14px;padding:12px}.annualItem b{display:block;font-size:19px;margin-top:3px}.chart{display:flex;align-items:flex-end;gap:7px;height:190px;padding:14px 4px 24px;margin-top:14px;border-bottom:1px solid #dfe5eb}.monthCol{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%;position:relative}.monthBar{width:72%;min-width:12px;background:#5379a5;border-radius:7px 7px 2px 2px;position:relative}.monthLabel{position:absolute;bottom:-22px;font-size:10px;color:#687386}.monthValue{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:#687386;white-space:nowrap;margin-bottom:3px}.incomeBox{margin-top:8px}.incomeInput{font-size:19px;font-weight:700}.annualFoot{font-size:12px;color:#687386;margin-top:10px}@media(max-width:480px){.quick{grid-template-columns:1fr 1fr}.quick button{grid-column:1/-1;padding:12px}.annualStats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="monthbar"><button onclick="moveMonth(-1)">‹</button><input id="monthPicker" type="month" onchange="changeMonth(this.value)"><button onclick="moveMonth(1)">›</button></div><div class="modeBox"><div class="row"><div><div class="name">住まいモード</div><div id="modeHint" class="sub"></div></div></div><button id="modeBtn" class="modeBtn" onclick="toggleSoloMode()"></button></div><div class="summary"><div class="budgetBox"><label>この月の目標予算</label><div class="totalLine"><input id="totalBudgetInput" class="totalInput" inputmode="numeric" pattern="[0-9]*" onchange="setTotalBudget(this.value)"><span>円</span></div></div><div class="incomeBox"><label>この月の手取り</label><div class="totalLine"><input id="incomeInput" class="incomeInput" inputmode="numeric" pattern="[0-9]*" placeholder="例 265000" onchange="setIncome(this.value)"><span>円</span></div><div id="incomeHint" class="sub" style="margin-top:5px"></div></div><div class="sub" style="margin-top:14px">今月の使用額</div><strong id="total">0円</strong><div class="bar"><div id="totalbar" class="fill"></div></div><div id="remain" class="sub"></div></div><div class="compare"><div class="compareGrid"><div class="compareItem"><div class="sub">先月の使用額</div><b id="prevTotal">0円</b></div><div class="compareItem"><div class="sub">先月比</div><b id="prevDiff">—</b><div id="prevDiffSub" class="sub"></div></div></div></div><div id="notice"></div><div id="cards"></div><button id="editToggle" class="editToggle" onclick="toggleEdit()">編集モード</button><button class="reset" onclick="resetMonth()">この月のデータを初期化</button><div class="annual"><h2 id="annualTitle">年間サマリー</h2><div class="annualStats"><div class="annualItem"><div class="sub">年間手取り</div><b id="annualIncome">0円</b></div><div class="annualItem"><div class="sub">年間支出</div><b id="annualSpend">0円</b></div><div class="annualItem"><div class="sub">消費率</div><b id="annualRate">—</b></div><div class="annualItem"><div class="sub">残った金額</div><b id="annualRemain">—</b></div></div><div class="sub">月ごとの支出</div><div id="annualChart" class="chart"></div><button id="copyBtn" class="copyBtn" onclick="copyForChatGPT()">📋 チャッピー相談用にコピー</button><div class="annualFoot">年間・月別・項目別のデータをまとめてコピーして、そのままChatGPTに貼り付けられます。</div></div></div><script>const APP_VERSION='2026-09-09-01';const DEFAULT_TOTAL=77000;const BASE_NAMES=['食費','交通費','外食','外遊費','ネットショッピング・ゲーム','課金系','家賃'];const SOLO_NAMES=['通信費','水道光熱費','日用品'];const RECURRING_NAMES=['家賃','通信費','水道光熱費'];const LAST_MONTH_KEY='budget-last-opened-month';const SOLO_KEY='budget-solo-mode';let current=/^\d{4}-\d{2}$/.test(localStorage.getItem(LAST_MONTH_KEY)||'')?localStorage.getItem(LAST_MONTH_KEY):'2026-08';let soloMode=localStorage.getItem(SOLO_KEY)==='1';let totalBudget=DEFAULT_TOTAL,income=0,incomeInherited=false,editMode=false;function key(m){return'budget-month-'+m}function totalKey(m){return'budget-total-'+m}function incomeKey(m){return'budget-income-'+m}function prevMonth(m){let[y,mo]=m.split('-').map(Number);mo--;if(mo<1){mo=12;y--}return y+'-'+String(mo).padStart(2,'0')}function normalize(arr){return (Array.isArray(arr)?arr:[]).map((x,i)=>({name:x.name||BASE_NAMES[i]||('項目'+(i+1)),items:Array.isArray(x.items)?x.items.map(v=>typeof v==='object'?{amount:Number(v.amount)||0,memo:String(v.memo||'')}:{amount:Number(v)||0,memo:''}):[]}))}function ensureCategories(arr){const out=normalize(arr);BASE_NAMES.forEach(n=>{if(!out.some(x=>x.name===n))out.push({name:n,items:[]})});SOLO_NAMES.forEach(n=>{if(!out.some(x=>x.name===n))out.push({name:n,items:[]})});return out}const old=localStorage.getItem('budget-2026-08-v1');if(old&&!localStorage.getItem(key('2026-08'))){try{localStorage.setItem(key('2026-08'),JSON.stringify(ensureCategories(JSON.parse(old))))}catch(e){}}function findPreviousCategoryAmount(m,name){let p=prevMonth(m);for(let i=0;i<120;i++){const s=localStorage.getItem(key(p));if(s){try{const c=ensureCategories(JSON.parse(s)).find(x=>x.name===name);if(c){const v=c.items.reduce((a,b)=>a+Number(b.amount||0),0);if(v>0)return v}}catch(e){}}p=prevMonth(p)}return 0}function load(m){const s=localStorage.getItem(key(m));if(s){try{return ensureCategories(JSON.parse(s))}catch(e){}}const out=ensureCategories([]);if(m>'2026-08')RECURRING_NAMES.forEach(name=>{const v=findPreviousCategoryAmount(m,name);if(v>0){const c=out.find(x=>x.name===name);c.items=[{amount:v,memo:'先月から据え置き'}]}});return out}function previousTotalBudget(m){let p=prevMonth(m);for(let i=0;i<120;i++){const n=Number(localStorage.getItem(totalKey(p)));if(n>0)return n;p=prevMonth(p)}return DEFAULT_TOTAL}function loadTotal(m){return Number(localStorage.getItem(totalKey(m)))||previousTotalBudget(m)}function previousIncome(m){let p=prevMonth(m);for(let i=0;i<120;i++){const n=Number(localStorage.getItem(incomeKey(p)));if(n>0)return n;p=prevMonth(p)}return 0}function getIncomeInfo(m){const explicit=Number(localStorage.getItem(incomeKey(m)));if(explicit>0)return{value:explicit,inherited:false};const inherited=previousIncome(m);return{value:inherited,inherited:inherited>0}}function hasSaved(m){return localStorage.getItem(key(m))!==null}function monthTotal(m){if(m!==current&&!hasSaved(m))return 0;const d=m===current?data:load(m);return d.reduce((sum,c)=>sum+c.items.reduce((a,b)=>a+Number(b.amount||0),0),0)}let data=load(current);totalBudget=loadTotal(current);({value:income,inherited:incomeInherited}=getIncomeInfo(current));const yen=n=>Math.round(n).toLocaleString()+'円';function save(){localStorage.setItem(key(current),JSON.stringify(data));localStorage.setItem(totalKey(current),String(totalBudget));if(!incomeInherited&&income>0)localStorage.setItem(incomeKey(current),String(income));else if(!incomeInherited)localStorage.removeItem(incomeKey(current))}function visibleCategory(c){return !SOLO_NAMES.includes(c.name)||soloMode}function render(){document.getElementById('monthPicker').value=current;document.getElementById('totalBudgetInput').value=Math.round(totalBudget);document.getElementById('incomeInput').value=income?Math.round(income):'';document.getElementById('incomeHint').textContent=incomeInherited?'前回入力した手取りを引き継いでいます':'';const mb=document.getElementById('modeBtn');mb.textContent=soloMode?'🏠 一人暮らしモード ON':'🏠 一人暮らしモードにする';mb.className='modeBtn '+(soloMode?'on':'');document.getElementById('modeHint').textContent=soloMode?'通信費・水道光熱費・日用品を表示中':'通常モード';document.getElementById('editToggle').textContent=editMode?'編集モードを終了':'編集モード';document.getElementById('notice').innerHTML=!hasSaved(current)&&current!=='2026-08'?'<div class="empty">未入力月です。家賃'+(soloMode?'・通信費・水道光熱費':'')+'などは直近の入力値を初期表示しています。何か入力・変更するとこの月に保存されます。</div>':'';const root=document.getElementById('cards');root.innerHTML='';root.style.display='flex';root.style.flexDirection='column';const useds=data.map(c=>c.items.reduce((a,b)=>a+Number(b.amount||0),0));const total=useds.reduce((a,b)=>a+b,0);const pcm=prevMonth(current),prevData=hasSaved(pcm)?load(pcm):null;data.forEach((c,i)=>{if(!visibleCategory(c))return;const used=useds[i],share=total?used/total*100:0;let compareText='先月比：比較なし',compareClass='sub';if(prevData){const pc=prevData.find(x=>x.name===c.name);if(pc){const pu=pc.items.reduce((s,x)=>s+Number(x.amount||0),0),df=used-pu;if(pu>0){const pp=df/pu*100,s=df>0?'+':df<0?'−':'±';compareText='先月比 '+s+yen(Math.abs(df))+'（'+s+Math.abs(pp).toFixed(1)+'%）';compareClass='catCompare '+(df>0?'danger':df<0?'good':'')}else if(used===0){compareText='先月比 ±0円（0.0%）';compareClass='catCompare'}else{compareText='先月比 +'+yen(used)+'（比較なし）';compareClass='catCompare danger'}}}const el=document.createElement('div');el.className='card';el.style.order=String(-used);const history=c.items.length?c.items.map((x,j)=>`<div class="historyItem"><span>${yen(x.amount)}${x.memo?` <span class="memo">（${escapeHtml(x.memo)}）</span>`:''}</span><button onclick="removeItem(${i},${j})" style="border:0;background:none;color:#65758b">削除</button></div>`).join(''):'記録なし';el.innerHTML=`${editMode?`<div class="editBox"><label>項目名</label><input class="nameEdit" value="${escapeAttr(c.name)}" onchange="renameCategory(${i},this.value)"></div>`:''}<div class="row"><div><div class="name">${escapeHtml(c.name)}</div><div class="share">今月支出の ${share.toFixed(1)}%</div><div class="${compareClass}">${compareText}</div></div><div class="amount">${yen(used)}</div></div><div class="bar"><div class="fill" style="width:${Math.min(100,share)}%"></div></div><div class="quick"><input inputmode="numeric" pattern="[0-9]*" placeholder="使った金額" id="in${i}"><input type="text" placeholder="メモ 例: 電気代" id="memo${i}"><button onclick="add(${i})">＋追加</button></div><div class="history">${history}</div>`;root.appendChild(el)});document.getElementById('total').textContent=yen(total);const remain=totalBudget-total;document.getElementById('remain').textContent=remain>=0?'目標まで残り '+yen(remain)+'（使用 '+(totalBudget?total/totalBudget*100:0).toFixed(1)+'%）':'目標を '+yen(-remain)+' 超過';document.getElementById('remain').className='sub '+(remain<0?'danger':'');const b=document.getElementById('totalbar');b.style.width=Math.min(100,totalBudget?total/totalBudget*100:0)+'%';b.className='fill '+(remain<0?'over':'');const pm=prevMonth(current),pt=monthTotal(pm);document.getElementById('prevTotal').textContent=hasSaved(pm)?yen(pt):'記録なし';const diff=total-pt,pct=pt?diff/pt*100:null,diffEl=document.getElementById('prevDiff'),sub=document.getElementById('prevDiffSub');if(!hasSaved(pm)){diffEl.textContent='—';diffEl.className='';sub.textContent='先月データがありません'}else if(diff===0){diffEl.textContent='±0円';diffEl.className='';sub.textContent='先月と同額'}else{diffEl.textContent=(diff>0?'+':'−')+yen(Math.abs(diff));diffEl.className=diff>0?'danger':'good';sub.textContent='先月より '+Math.abs(pct).toFixed(1)+'% '+(diff>0?'増':'減')}renderAnnual()}function annualData(){const year=current.slice(0,4),monthly=[];let spend=0,inc=0;for(let m=1;m<=12;m++){const ym=year+'-'+String(m).padStart(2,'0'),active=hasSaved(ym)||Number(localStorage.getItem(incomeKey(ym)))>0,s=hasSaved(ym)?monthTotal(ym):0,i=active?getIncomeInfo(ym).value:0;monthly.push({m,s,i,active});spend+=s;inc+=i}return{year,monthly,spend,inc}}function renderAnnual(){const a=annualData();document.getElementById('annualTitle').textContent=a.year+'年 年間サマリー';document.getElementById('annualIncome').textContent=a.inc?yen(a.inc):'未入力';document.getElementById('annualSpend').textContent=yen(a.spend);const rate=a.inc?a.spend/a.inc*100:null;document.getElementById('annualRate').textContent=rate===null?'—':rate.toFixed(1)+'%';const rem=a.inc?a.inc-a.spend:null,re=document.getElementById('annualRemain');re.textContent=rem===null?'—':(rem>=0?yen(rem):'−'+yen(-rem));re.className=rem!==null&&rem<0?'danger':'good';const max=Math.max(...a.monthly.map(x=>x.s),1);document.getElementById('annualChart').innerHTML=a.monthly.map(x=>`<div class="monthCol"><div class="monthBar" style="height:${Math.max(2,x.s/max*100)}%">${x.s?`<div class="monthValue">${Math.round(x.s/1000)}k</div>`:''}</div><div class="monthLabel">${x.m}月</div></div>`).join('')}function buildChatText(){const a=annualData(),rate=a.inc?(a.spend/a.inc*100).toFixed(1)+'%':'未計算',rem=a.inc?a.inc-a.spend:null;let text=`家計データを見て、支出の傾向・使いすぎている項目・改善できそうな点を分析してほしい。\n\n【${a.year}年 年間サマリー】\n年間手取り：${a.inc?yen(a.inc):'未入力'}\n年間支出：${yen(a.spend)}\n消費率：${rate}\n残った金額：${rem===null?'未計算':yen(rem)}\n\n【月別】\n`;a.monthly.forEach(x=>{if(x.active||x.s>0)text+=`${x.m}月：支出 ${yen(x.s)}／手取り ${x.i?yen(x.i):'未入力'}\n`});text+='\n【月別の項目・明細】\n';for(let m=1;m<=12;m++){const ym=a.year+'-'+String(m).padStart(2,'0');if(!hasSaved(ym))continue;const d=load(ym),mt=monthTotal(ym);text+=`\n■ ${m}月（合計 ${yen(mt)}）\n`;d.map(c=>({c,t:c.items.reduce((s,x)=>s+Number(x.amount||0),0)})).filter(x=>x.t>0).sort((x,y)=>y.t-x.t).forEach(({c,t})=>{text+=`・${c.name}: ${yen(t)}（${mt?(t/mt*100).toFixed(1):'0.0'}%）\n`;c.items.forEach(x=>text+=`  - ${yen(x.amount)}${x.memo?'（'+x.memo+'）':''}\n`)})}return text}async function copyForChatGPT(){const text=buildChatText(),btn=document.getElementById('copyBtn');try{await navigator.clipboard.writeText(text);btn.textContent='✓ コピーしました'}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();btn.textContent='✓ コピーしました'}setTimeout(()=>btn.textContent='📋 チャッピー相談用にコピー',1800)}function add(i){const input=document.getElementById('in'+i),memo=document.getElementById('memo'+i),v=Number((input.value||'').replace(/,/g,''));if(!v||v<0)return;data[i].items.push({amount:v,memo:memo.value.trim()});save();render()}function removeItem(i,j){data[i].items.splice(j,1);save();render()}function renameCategory(i,v){const name=v.trim();if(!name){render();return}data[i].name=name;save();render()}function toggleEdit(){editMode=!editMode;render()}function toggleSoloMode(){soloMode=!soloMode;localStorage.setItem(SOLO_KEY,soloMode?'1':'0');data=ensureCategories(data);render()}function setTotalBudget(v){const n=Number(String(v).replace(/,/g,''));if(!n||n<=0){render();return}totalBudget=Math.round(n);save();render()}function setIncome(v){const n=Number(String(v).replace(/,/g,''));income=n>0?Math.round(n):0;incomeInherited=false;save();render()}function changeMonth(m){if(!m)return;current=m;localStorage.setItem(LAST_MONTH_KEY,current);data=load(current);totalBudget=loadTotal(current);({value:income,inherited:incomeInherited}=getIncomeInfo(current));editMode=false;render()}function moveMonth(d){let[y,m]=current.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}changeMonth(y+'-'+String(m).padStart(2,'0'))}function resetMonth(){if(!confirm(current.replace('-','年')+'月の入力データ・目標予算・手取りを初期化しますか？'))return;localStorage.removeItem(key(current));localStorage.removeItem(totalKey(current));localStorage.removeItem(incomeKey(current));data=load(current);totalBudget=loadTotal(current);({value:income,inherited:incomeInherited}=getIncomeInfo(current));editMode=false;render()}function escapeHtml(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]||c))}function escapeAttr(s){return escapeHtml(s)}localStorage.setItem(LAST_MONTH_KEY,current);let lastUpdateCheck=0;async function checkForUpdate(){const now=Date.now();if(now-lastUpdateCheck<15000)return;lastUpdateCheck=now;try{const html=await fetch(location.pathname+'?updatecheck='+now,{cache:'no-store'}).then(r=>r.text()),m=html.match(/const APP_VERSION='([^']+)'/);if(m&&m[1]!==APP_VERSION)location.replace(location.pathname+'?v='+encodeURIComponent(m[1]))}catch(e){}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});window.addEventListener('focus',checkForUpdate);setTimeout(checkForUpdate,1500);render();</script></body></html>
