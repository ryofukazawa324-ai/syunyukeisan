name: Add recent suggestions
on:
  push:
    paths:
      - '.github/workflows/add-recent-suggestions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_recent_suggestions.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m "Show three recent entries as suggestions" || true
          git push
