name: Patch fixed auto carryover
on:
  push:
    paths:
      - '.github/workflows/patch-fixed-auto.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const APP_VERSION='2026-09-24-01'", "const APP_VERSION='2026-09-27-02'")
          old="function findPreviousCategoryAmount(m,name){let p=prevMonth(m);for(let i=0;i<120;i++){const s=localStorage.getItem(key(p));if(s)try{const c=ensureCategories(JSON.parse(s)).find(x=>x.name===name),v=c?c.items.reduce((a,b)=>a+Number(b.amount||0),0):0;if(v>0)return v}catch(e){}p=prevMonth(p)}return 0}function load(m){const s=localStorage.getItem(key(m));if(s)try{return ensureCategories(JSON.parse(s))}catch(e){}const out=ensureCategories([]);if(m>'2026-08')RECURRING_NAMES.forEach(name=>{const v=findPreviousCategoryAmount(m,name);if(v>0)out.find(x=>x.name===name).items=[{amount:v,memo:'先月から据え置き'}]});return out}"
          new="function findPreviousCategoryAmount(m,name){let p=prevMonth(m);for(let i=0;i<120;i++){const s=localStorage.getItem(key(p));if(s)try{const c=ensureCategories(JSON.parse(s)).find(x=>x.name===name),v=c?c.items.reduce((a,b)=>a+Number(b.amount||0),0):0;if(v>0)return v}catch(e){}p=prevMonth(p)}return 0}function findPreviousAutoItems(m){let p=prevMonth(m);for(let i=0;i<120;i++){const s=localStorage.getItem(key(p));if(s)try{const cats=normalize(JSON.parse(s)),c=cats.find(x=>x.name==='固定費');if(c){const items=c.items.filter(x=>/auto\\s*$/i.test(String(x.memo||''))).map(x=>({amount:Number(x.amount)||0,memo:String(x.memo||'')})).filter(x=>x.amount>0);if(items.length)return items}}catch(e){}p=prevMonth(p)}return[]}function load(m){const s=localStorage.getItem(key(m));if(s)try{return ensureCategories(JSON.parse(s))}catch(e){}const out=ensureCategories([]);if(m>'2026-08'){RECURRING_NAMES.forEach(name=>{const v=findPreviousCategoryAmount(m,name);if(v>0)out.find(x=>x.name===name).items=[{amount:v,memo:'先月から据え置き'}]});const auto=findPreviousAutoItems(m);if(auto.length){let fixed=out.find(x=>x.name==='固定費');if(!fixed){fixed={name:'固定費',items:[]};out.push(fixed)}fixed.items=auto}}return out}"
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add fixed cost auto carryover" || exit 0
          git push
