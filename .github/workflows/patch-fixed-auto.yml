name: Remove solo living mode button
on:
  push:
    paths:
      - '.github/workflows/patch-fixed-auto.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const APP_VERSION='2026-09-27-03'", "const APP_VERSION='2026-09-30-01'")
          start='<div class="modeBox"><div class="name">住まいモード</div><div id="modeHint" class="sub"></div><button id="modeBtn" class="modeBtn" onclick="toggleSoloMode()"></button></div>'
          if start not in s:
              raise SystemExit('solo mode button block not found')
          s=s.replace(start,'')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Remove solo living mode button" || exit 0
          git push
