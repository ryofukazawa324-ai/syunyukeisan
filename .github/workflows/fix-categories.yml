name: Fix categories
on:
  push:
    paths:
      - '.github/workflows/fix-categories.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_categories.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m "Fix category persistence" || true
          git push
